[package]
name = "oxide_parse-py"
version = "0.9.1"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
oxide_parse-core = { path = "../core", default-features = false }
pyo3 = { version = "0.23" }
rayon = "1"
serde_json = "1"

# Choose engines at build time, e.g.
#   maturin develop --release --no-default-features --features "lite,stream"
[features]
default = ["scraper", "json"]
abi3 = ["pyo3/abi3-py310"]
abi3-py39 = ["pyo3/abi3-py39"]
scraper = ["oxide_parse-core/engine-scraper"]
lite = ["oxide_parse-core/engine-lite"]
stream = ["lite", "oxide_parse-core/engine-stream"]
json = ["oxide_parse-core/engine-json"]
fast = ["lite", "stream", "json"]
full = ["scraper", "lite", "stream", "json"]
