[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "oxide-parse"
version = "0.9.1"
description = "Declarative extraction compiler: Python DSL -> IR -> Rust execution plan"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/M-16gt/oxide_parse"
Repository = "https://github.com/M-16gt/oxide_parse"
Documentation = "https://github.com/M-16gt/oxide_parse/blob/main/docs/index.md"
Issues = "https://github.com/M-16gt/oxide_parse/issues"
Changelog = "https://github.com/M-16gt/oxide_parse/blob/main/CHANGELOG.md"

[project.scripts]
oxide-parse = "oxide_parse.__main__:main"

[project.optional-dependencies]
yaml = ["pyyaml"]
toml = ["tomli>=2.0 ; python_version < '3.11'", "tomli-w>=1.0"]
bench = [
    "beautifulsoup4",
    "markdownify",
    "html2text",
    "frostwork>=0.2.2 ; python_full_version >= '3.10'",
    "lxml",
    "parsel",
    "scrapling>=0.5.1 ; python_full_version >= '3.10'",
    "selectolax",
]
test = ["pytest", "lxml"]

[tool.maturin]
profile = "release"
python-source = "python"
module-name = "oxide_parse._core"
manifest-path = "crates/py/Cargo.toml"
features = ["pyo3/extension-module", "full"]
exclude = [".secrets/**", ".pypirc", ".env*", ".migration/**", "benchmarks/**"]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "maturin>=1.5,<2.0",
    "mypy>=1.19.1",
    "parsel>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8",
    "selectolax>=1.0.2",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.mypy]
files = ["python/oxide_parse"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
