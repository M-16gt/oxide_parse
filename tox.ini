[tox]
requires = tox>=4
env_list = py39, py310, py311, py312, py313, py314, py315
skip_missing_interpreters = false

[testenv]
description = Test the full native wheel on {base_python}
package = wheel
# Match the release wheel across CPython 3.10+.
wheel_build_env = .pkg
extras =
    test
    yaml
    toml
    bench
set_env =
    CONFORMANCE_REPORT_DIR = {env_tmp_dir}/conformance
commands =
    python -VV
    python -c "from oxide_parse import engines; assert set(('json', 'lite', 'scraper', 'stream')).issubset(e.name for e in engines())"
    python scripts/gen_ir_schema.py --check
    python -m pytest -q {posargs:tests}

[testenv:py39]
wheel_build_env = .pkg-cpython39

[testenv:.pkg]
set_env =
    MATURIN_PEP517_ARGS = --locked --features full,abi3,pyo3/extension-module

[testenv:.pkg-cpython39]
set_env =
    MATURIN_PEP517_ARGS = --locked
